allowBuilds:
  '@parcel/watcher': true
  core-js: true
  deasync: true
  electron: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
minimumReleaseAgeExclude:
  - prettier@3.10.0
  - sass@1.108.2
onlyBuiltDependencies:
  - '@parcel/watcher'
  - core-js
  - deasync
  - electron
  - esbuild
  - unrs-resolver
  - vue-demi
overrides:
  rolldown: 1.2.16
